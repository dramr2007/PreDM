name: Hakim AI episode 44 free Arabic Piper video
on:
  push:
    branches:
      - hakim-ai-free-voice-test
    paths:
      - "hakim-voice/input_HAI-C0044.txt"
      - "hakim-voice/build_video_c0044.py"
      - ".github/workflows/hakim-free-voice-c0044.yml"
  workflow_dispatch:
concurrency:
  group: hakim-ai-voice-release
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  synthesize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout experiment branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install local speech engine
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'piper-tts==1.3.0'
      - name: Download open Arabic Kareem voice
        run: |
          mkdir -p hakim-voice/model hakim-voice/output
          curl --fail --location --retry 3 --retry-delay 3 \
            "https://huggingface.co/rhasspy/piper-voices/resolve/main/ar/ar_JO/kareem/medium/ar_JO-kareem-medium.onnx" \
            -o hakim-voice/model/ar_JO-kareem-medium.onnx
          curl --fail --location --retry 3 --retry-delay 3 \
            "https://huggingface.co/rhasspy/piper-voices/resolve/main/ar/ar_JO/kareem/medium/ar_JO-kareem-medium.onnx.json" \
            -o hakim-voice/model/ar_JO-kareem-medium.onnx.json
      - name: Generate narration locally
        run: |
          piper --model hakim-voice/model/ar_JO-kareem-medium.onnx \
            --config hakim-voice/model/ar_JO-kareem-medium.onnx.json \
            --output_file hakim-voice/output/HAI-C0044_arabic_voice_raw.wav \
            < hakim-voice/input_HAI-C0044.txt
          python - <<'PY'
          import wave, array, math, pathlib
          source = pathlib.Path("hakim-voice/output/HAI-C0044_arabic_voice_raw.wav")
          dest = pathlib.Path("hakim-voice/output/HAI-C0044_arabic_voice_master.wav")
          with wave.open(str(source),"rb") as w:
              channels=w.getnchannels(); rate=w.getframerate(); sw=w.getsampwidth(); n=w.getnframes()
              raw=w.readframes(n)
          if sw != 2:
              raise ValueError(f"Unexpected sample width {sw}; input kept untouched")
          samples=array.array("h"); samples.frombytes(raw)
          peak=max(abs(v) for v in samples) if samples else 0
          rms=math.sqrt(sum(v*v for v in samples)/len(samples)) if samples else 0
          target_rms=32767*10**(-19/20)
          limit=32767*10**(-1.8/20)
          gain=min(target_rms/max(1,rms),limit/max(1,peak))
          master=array.array("h",(int(max(-32768,min(32767,round(v*gain)))) for v in samples))
          with wave.open(str(dest),"wb") as w:
              w.setnchannels(channels); w.setsampwidth(sw); w.setframerate(rate); w.writeframes(master.tobytes())
          print({"duration_s":round(n/rate,2),"sample_rate":rate,"channels":channels,"peak_before":peak,"peak_after":max(abs(v) for v in master),"rms_before":round(rms,2),"gain":round(gain,3),"output":str(dest)})
          PY
      - name: Install font and portable video encoder
        run: |
          python -m pip install pillow imageio-ffmpeg
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-core
      - name: Create Arabic RTL corrected vertical educational video
        run: |
          python hakim-voice/build_video_c0044.py
          ls -lh hakim-voice/HAI-C0044-data-leakage-AR-fixed.mp4
      - name: Publish finished teaching video on isolated public test branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hakim-voice/HAI-C0044-data-leakage-AR-fixed.mp4
          git commit -m "Render Hakim AI episode 44 with correct Arabic RTL and free voice" || true
          git fetch origin hakim-ai-free-voice-test
          git rebase origin/hakim-ai-free-voice-test
          git push origin HEAD:hakim-ai-free-voice-test
      - name: Save voiceover files
        uses: actions/upload-artifact@v4
        with:
          name: hakim-c0044-arabic-voice
          path: |
            hakim-voice/output/*
            hakim-voice/HAI-C0044-data-leakage-AR-fixed.mp4
          if-no-files-found: error
          retention-days: 7
