name: HAKIM AI — free male Arabic episode production
on:
  push:
    branches: [hakim-ai-free-voice-test]
    paths:
      - "hakim-voice/episodes/*.json"
  workflow_dispatch:
    inputs:
      episode_id:
        description: "Episode ID e.g. HAI-C0061"
        type: string
        required: false
        default: "HAI-C0060"
permissions:
  contents: write
concurrency:
  group: hakim-free-episode-render
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - name: Checkout the experiment branch
        uses: actions/checkout@v4
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Free dependencies (no paid API)
        run: |
          python -m pip install "piper-tts==1.3.0" pillow
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-core
      - name: Download Piper Kareem male Arabic model
        run: |
          mkdir -p hakim-voice/model hakim-voice/output
          curl -fLSs --retry 3 https://huggingface.co/rhasspy/piper-voices/resolve/main/ar/ar_JO/kareem/medium/ar_JO-kareem-medium.onnx -o hakim-voice/model/ar_JO-kareem-medium.onnx
          curl -fLSs --retry 3 https://huggingface.co/rhasspy/piper-voices/resolve/main/ar/ar_JO/kareem/medium/ar_JO-kareem-medium.onnx.json -o hakim-voice/model/ar_JO-kareem-medium.onnx.json
      - name: Select episode from the changed metadata
        run: |
          python - <<'PY'
          import json,os,subprocess
          if os.environ["GITHUB_EVENT_NAME"]=="workflow_dispatch":
              event=json.load(open(os.environ["GITHUB_EVENT_PATH"]))
              ep=event.get("inputs",{}).get("episode_id") or "HAI-C0060"
              path="hakim-voice/episodes/"+ep+".json"
          else:
              changed=subprocess.check_output(["git","show","--pretty=format:","--name-only",os.environ["GITHUB_SHA"]],text=True).splitlines()
              candidates=[p for p in changed if p.startswith("hakim-voice/episodes/HAI-C") and p.endswith(".json")]
              if len(candidates)!=1: raise RuntimeError("Need exactly one new episode per commit")
              path=candidates[0]
          with open(path,encoding="utf8") as f: ep=json.load(f)["id"]
          with open(os.environ["GITHUB_ENV"],"a") as f:
              f.write("EPISODE_FILE="+path+"\n")
              f.write("EPISODE_ID="+ep+"\n")
          print("Rendering",ep)
          PY
      - name: Render six-scene video with free male Arabic narration
        run: |
          python hakim-voice/render_free_episode.py "$EPISODE_FILE"
          ffprobe -v error -show_entries format=duration,size -show_entries stream=codec_name,width,height -of json "hakim-voice/output/$EPISODE_ID/$EPISODE_ID-FREE-MALE.mp4"
      - name: Retain draft video on isolated experiment branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "hakim-voice/output/$EPISODE_ID/$EPISODE_ID-FREE-MALE.mp4" "hakim-voice/output/$EPISODE_ID/production_report.json"
          git commit -m "Render $EPISODE_ID free male Arabic educational short" || true
          git push origin HEAD:hakim-ai-free-voice-test
      - name: Keep QC files for seven days
        uses: actions/upload-artifact@v4
        with:
          name: free-male-video-review
          path: hakim-voice/output/
          retention-days: 7
