name: HAKIM AI - Free Arabic male voice audition
on:
  push:
    branches: [hakim-ai-free-voice-test]
    paths:
      - "hakim-voice/voice-auditions/audar-trial-request.md"
permissions:
  contents: write
concurrency:
  group: hakim-audar-audition-only
  cancel-in-progress: false
jobs:
  audition:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free open Arabic-first speech model runner
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg libsndfile1
          python -m pip install --upgrade pip
          python -m pip install "llama-cpp-python>=0.3" neucodec soundfile torch librosa huggingface_hub numpy
          git clone -q --depth 1 https://github.com/AudarAI/Audar-TTS-V1.git /tmp/Audar-TTS-V1
      - name: Synthesize one short male-voice audition, not a public video
        run: |
          mkdir -p hakim-voice/voice-auditions/output
          python - <<'PY'
          from huggingface_hub import hf_hub_download
          import shutil
          path=hf_hub_download('audarai/Audar-TTS-V1-Flash','samples/demo_male_1_ar.wav')
          shutil.copy2(path,'/tmp/audar_reference_full.wav')
          PY
          ffmpeg -nostdin -y -loglevel error -i /tmp/audar_reference_full.wav -ar 16000 -ac 1 /tmp/audar_reference.wav
          python /tmp/Audar-TTS-V1/examples/synthesize_gguf.py \
            'هل تعني فترة الثقة خمسة وتسعين في المئة أن المتوسط الحقيقي داخل هذا النطاق يقينًا؟ لا؛ بل نتحدث عن تكرار طريقة التقدير عبر عينات كثيرة.' \
            --ref /tmp/audar_reference.wav \
            --ref-text 'لا يمكنني الانتظار لأخبرك لقد أنجزنا المشروع أخيرا بعد كل هذا التعب وصدقني إنه أجمل شعور على الإطلاق' \
            --out hakim-voice/voice-auditions/output/HAI-C0069_AUDAR_RAW.wav
          ffmpeg -nostdin -y -loglevel error -i hakim-voice/voice-auditions/output/HAI-C0069_AUDAR_RAW.wav \
            -af 'atempo=1.10,loudnorm=I=-16:TP=-1.5:LRA=11' \
            -ar 24000 -ac 1 hakim-voice/voice-auditions/output/HAI-C0069_AUDAR_CLEAR_FAST.wav
      - name: Machine QA, not equivalent to listening
        run: |
          python - <<'PY'
          import json,wave
          import numpy as np
          p='hakim-voice/voice-auditions/output/HAI-C0069_AUDAR_CLEAR_FAST.wav'
          with wave.open(p,'rb') as f:
              duration=f.getnframes()/f.getframerate()
              samples=np.frombuffer(f.readframes(f.getnframes()),dtype='<i2')
          peak=float(np.abs(samples.astype('float32')).max()/32768) if samples.size else 0
          silence=float((np.abs(samples)<655).mean()) if samples.size else 1
          report={'status':'TECHNICALLY_READY_FOR_HUMAN_VOICE_REVIEW' if 3<duration<40 and 0.02<peak<1 and silence<0.80 else 'FAILED_QA',
            'audition_only':True,'public_video_posted':False,'model':'Audar-TTS V1 Flash Q4_K_M',
            'voice_profile':'demo_male_1; synthetic licensed voice','duration_s':round(duration,2),
            'peak':round(peak,4),'fraction_low_level':round(silence,3),'speed':1.10,
            'require_voice_quality_review_before_publication':True}
          open('hakim-voice/voice-auditions/output/QA.json','w',encoding='utf8').write(json.dumps(report,ensure_ascii=False,indent=2))
          print(json.dumps(report,ensure_ascii=False,indent=2))
          assert report['status']=='TECHNICALLY_READY_FOR_HUMAN_VOICE_REVIEW', 'Signal QA failed'
          PY
      - name: Commit preview only on isolated experiment branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hakim-voice/voice-auditions/output/HAI-C0069_AUDAR_CLEAR_FAST.wav hakim-voice/voice-auditions/output/QA.json
          git commit -m 'Trial new free Arabic male voice for Hakim AI; not published' || true
          git push origin HEAD:hakim-ai-free-voice-test
      - name: Retain review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hakim-audar-male-audition-only
          path: hakim-voice/voice-auditions/output/
          retention-days: 7
