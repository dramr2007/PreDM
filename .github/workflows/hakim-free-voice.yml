name: Hakim AI free Arabic Piper voice
on:
  push:
    branches:
      - hakim-ai-free-voice-test
    paths:
      - "hakim-voice/**"
      - ".github/workflows/hakim-free-voice.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthesize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout experiment branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install local speech engine
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'piper-tts==1.3.0'
      - name: Download open Arabic Kareem voice
        run: |
          mkdir -p hakim-voice/model hakim-voice/output
          curl --fail --location --retry 3 --retry-delay 3 \
            "https://huggingface.co/rhasspy/piper-voices/resolve/main/ar/ar_JO/kareem/medium/ar_JO-kareem-medium.onnx" \
            -o hakim-voice/model/ar_JO-kareem-medium.onnx
          curl --fail --location --retry 3 --retry-delay 3 \
            "https://huggingface.co/rhasspy/piper-voices/resolve/main/ar/ar_JO/kareem/medium/ar_JO-kareem-medium.onnx.json" \
            -o hakim-voice/model/ar_JO-kareem-medium.onnx.json
      - name: Generate narration locally
        run: |
          piper --model hakim-voice/model/ar_JO-kareem-medium.onnx \
            --config hakim-voice/model/ar_JO-kareem-medium.onnx.json \
            --output_file hakim-voice/output/HAI-C0041_arabic_voice_raw.wav \
            < hakim-voice/input_HAI-C0041.txt
          ffmpeg -y -i hakim-voice/output/HAI-C0041_arabic_voice_raw.wav \
            -af "highpass=f=70,loudnorm=I=-16:TP=-1.8:LRA=7" \
            -ar 48000 -ac 1 hakim-voice/output/HAI-C0041_arabic_voice_master.wav
          ffprobe -v error -show_entries format=duration -of default=nw=1 hakim-voice/output/HAI-C0041_arabic_voice_master.wav
      - name: Save voiceover files
        uses: actions/upload-artifact@v4
        with:
          name: hakim-c0041-arabic-voice
          path: hakim-voice/output/*
          if-no-files-found: error
          retention-days: 7
