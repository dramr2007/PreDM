name: Hakim AI free Arabic voice
on:
  push:
    branches: [hakim-ai-free-voice-test]
    paths:
      - "hakim-voice/**"
      - ".github/workflows/hakim-ai-piper.yml"
  workflow_dispatch:
    inputs:
      script:
        description: "Path to UTF-8 Arabic script"
        default: "hakim-voice/input_HAI-C0041.txt"
        required: false

permissions:
  contents: read

jobs:
  produce-arabic-voice:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Piper TTS
        run: python -m pip install --no-input --disable-pip-version-check piper-tts
      - name: Fetch Arabic model
        run: |
          mkdir -p output
          curl --fail --location --retry 3 --silent --show-error \
            "https://huggingface.co/rhasspy/piper-voices/resolve/main/ar/ar_JO/kareem/medium/ar_JO-kareem-medium.onnx" \
            -o output/voice.onnx
          curl --fail --location --retry 3 --silent --show-error \
            "https://huggingface.co/rhasspy/piper-voices/resolve/main/ar/ar_JO/kareem/medium/ar_JO-kareem-medium.onnx.json" \
            -o output/voice.onnx.json
          ls -lh output/voice.onnx*
          test $(stat -c %s output/voice.onnx) -gt 1000000
      - name: Install ffmpeg and ffprobe
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Generate Arabic narration
        env:
          SCRIPT: ${{ inputs.script || 'hakim-voice/input_HAI-C0041.txt' }}
        run: |
          test -f "$SCRIPT"
          python -m piper -m output/voice.onnx -f output/HAI-C0041-piper.wav < "$SCRIPT"
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1 output/HAI-C0041-piper.wav
          ffmpeg -hide_banner -loglevel error -y -i output/HAI-C0041-piper.wav -ac 1 -ar 48000 -af "highpass=f=70,loudnorm=I=-16:TP=-1.8:LRA=7" -c:a pcm_s24le output/HAI-C0041-voice-master.wav
          ffmpeg -hide_banner -loglevel error -y -i output/HAI-C0041-voice-master.wav -c:a libmp3lame -b:a 160k output/HAI-C0041-voice-preview.mp3
          ffmpeg -hide_banner -loglevel error -i output/HAI-C0041-voice-master.wav -f null -
      - uses: actions/upload-artifact@v4
        with:
          name: hakim-c0041-arabic-voice
          path: |
            output/HAI-C0041-voice-master.wav
            output/HAI-C0041-voice-preview.mp3
          if-no-files-found: error
          retention-days: 7
